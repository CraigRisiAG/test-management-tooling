name: Code Quality & Coverage

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/lcov.info ]; then
            lines=$(grep -m1 'LF:' coverage/lcov.info | cut -d: -f2)
            covered=$(grep -m1 'LH:' coverage/lcov.info | cut -d: -f2)
            percent=$(awk "BEGIN { if ($lines>0) printf \"%.1f\", ($covered/$lines)*100; else print 0 }")
            echo "- Lines covered: ${covered}/${lines} (${percent}%)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi